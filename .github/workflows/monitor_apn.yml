name: Monitor SMN - Áreas Protegidas APN

# Sin cron: GitHub Actions no puede leer ssl.smn.gob.ar (Cloudflare 403),
# el job quedaba en rojo cada hora y GitHub mandaba mail de fallo.
# La operación real es el favorito + visor. Este workflow queda solo
# para disparo manual (pestaña Actions), y no se marca como fallido
# si el SMN está bloqueado.
on:
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit de los productos generados

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Autotest de geometría (sin red)
        run: python scripts/monitor_smn_apn.py --self-test

      - name: Generar config.json desde Secrets
        env:
          APN_SMTP_HOST: ${{ secrets.APN_SMTP_HOST }}
          APN_SMTP_PORT: ${{ secrets.APN_SMTP_PORT }}
          APN_SMTP_USER: ${{ secrets.APN_SMTP_USER }}
          APN_SMTP_PASS: ${{ secrets.APN_SMTP_PASS }}
          APN_RECIPIENTS_JSON: ${{ secrets.APN_RECIPIENTS_JSON }}
          APN_VISOR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/monitor_smn_apn.py --write-config-from-env --config config.json

      - name: Ejecutar monitoreo
        id: monitor
        continue-on-error: true
        run: python scripts/monitor_smn_apn.py --config config.json

      - name: Publicar productos generados y actualizar historial
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualiza alertas SMN y áreas afectadas [skip ci]"
          file_pattern: "docs/data/*.json docs/data/*.geojson historial.json"
